<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Astro Vastu Setu</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        :root {
            --primary: #c9933b;
            --secondary: #8c5b20;
            --dark: #2c1e16;
            --light: #f9f5f0;
            --white: #ffffff;
            --gray: #e0e0e0;
            --text: #4a3f35;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light);
            color: var(--text);
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: var(--dark);
            color: var(--white);
            min-height: 100vh;
            padding: 20px 0;
            position: fixed;
            left: 0;
            top: 0;
        }

        .sidebar h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: var(--white);
            padding: 15px 25px;
            text-decoration: none;
            transition: 0.3s;
        }

        .sidebar a:hover, .sidebar a.active {
            background: var(--primary);
        }

        .sidebar a i {
            margin-right: 10px;
        }

        /* Main Content */
        .main-content {
            margin-left: 250px;
            padding: 30px;
            width: calc(100% - 250px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: var(--white);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .btn {
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
        }

        .btn:hover {
            background: var(--secondary);
        }

        .btn-danger {
            background: #dc3545;
        }
        
        .btn-danger:hover {
            background: #c82333;
        }

        .btn-edit {
            background: #ffc107;
            color: #212529;
            padding: 5px 10px;
            font-size: 14px;
        }

        .btn-delete {
            background: #dc3545;
            padding: 5px 10px;
            font-size: 14px;
        }

        /* Table */
        .card {
            background: var(--white);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            text-align: left;
            padding: 12px 15px;
            border-bottom: 1px solid var(--gray);
        }

        th {
            background: #f1ebd9;
            color: var(--dark);
            font-weight: 600;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .product-img {
            width: 50px;
            height: 50px;
            border-radius: 5px;
            object-fit: cover;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--white);
            width: 600px;
            max-width: 90%;
            border-radius: 8px;
            padding: 25px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close-modal {
            cursor: pointer;
            font-size: 24px;
            color: #666;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--gray);
            border-radius: 5px;
            font-family: inherit;
            box-sizing: border-box;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group {
            flex: 1;
        }
        
        .preview-img {
            max-width: 100px;
            margin-top: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Astro Vastu Setu</h2>
        <a href="index.html"><i class="fas fa-home"></i> View Site</a>
        <a href="#" class="active"><i class="fas fa-box"></i> Products</a>
        <a href="#" onclick="alert('Orders feature coming soon!')"><i class="fas fa-shopping-cart"></i> Orders</a>
        <a href="#" onclick="alert('Settings feature coming soon!')"><i class="fas fa-cog"></i> Settings</a>
        <a href="#" onclick="resetData()" style="color: #ffaaaa; margin-top: 50px;"><i class="fas fa-undo"></i> Reset Data</a>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Product Management</h1>
            <button class="btn" onclick="openModal()"><i class="fas fa-plus"></i> Add New Product</button>
        </div>

        <div class="card">
            <table id="productTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Image/Emoji</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price (₹)</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Products injected via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Product</h2>
                <span class="close-modal" onclick="closeModal()">&times;</span>
            </div>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="productName" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Category</label>
                        <select id="productCategory" required>
                            <option value="bracelets">Bracelets</option>
                            <option value="rudraksha">Rudraksha</option>
                            <option value="dhanyog">Dhanyog</option>
                            <option value="lakshmipotli">Lakshmi Potli</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Subcategory (slug)</label>
                        <input type="text" id="productSubcategory" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Price (₹)</label>
                        <input type="number" id="productPrice" required>
                    </div>
                    <div class="form-group">
                        <label>MRP (₹)</label>
                        <input type="number" id="productMrp" required>
                    </div>
                    <div class="form-group">
                        <label>Discount (%)</label>
                        <input type="number" id="productDiscount">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Emoji (Icon)</label>
                        <input type="text" id="productEmoji">
                    </div>
                    <div class="form-group">
                        <label>Upload Image</label>
                        <input type="file" id="productImageFile" accept="image/*">
                        <input type="hidden" id="productImageUrl">
                        <div id="uploadStatus" style="font-size: 12px; margin-top: 5px;"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Short Description</label>
                    <textarea id="productDesc" rows="3" required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="productInStock" checked> In Stock
                        </label>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="productIsFeatured" checked> Featured (show on Home)
                        </label>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="productIsNew"> New Arrival
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn" style="width: 100%; margin-top: 15px;">Save Product</button>
            </form>
        </div>
    </div>

    <!-- Login Modal (Full Screen) -->
    <div class="modal" id="adminLoginModal" style="display:flex; background:var(--dark);">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <h2 style="color:var(--primary); margin-bottom:20px;">Admin Login</h2>
            <p style="margin-bottom: 20px; font-size:14px;">Restricted Access: Website Owners Only</p>
            <form id="adminLoginForm">
                <div class="form-group">
                    <input type="text" id="adminUsername" placeholder="Username" required>
                </div>
                <div class="form-group">
                    <input type="password" id="adminPassword" placeholder="Password" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Login</button>
            </form>
            <div id="loginError" style="color: red; margin-top: 10px; display: none;">Invalid credentials</div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
